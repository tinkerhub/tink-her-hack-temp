<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Studio - Myntra3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <h1>Myntra<span class="highlight">3D</span></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart <span id="cart-count" class="cart-badge">0</span></a></li>
            </ul>
        </div>
    </nav>

    <!-- Studio Layout -->
    <div class="studio-container">
        
        <!-- Left Panel - 3D Viewer -->
        <div class="studio-viewer">
            <div class="viewer-header">
                <h2 id="product-title">Classic Cap</h2>
                <p>Rotate with mouse • Zoom with scroll</p>
            </div>
            <!-- Three.js Canvas Container -->
            <div id="canvas-container"></div>
            <div class="viewer-footer">
                <p class="hint">💡 Tip: Click and drag to rotate the model</p>
            </div>
        </div>

        <!-- Right Panel - Customization Options -->
        <div class="studio-controls">
            <div class="controls-content">
                
                <!-- Product Info -->
                <div class="control-section">
                    <h3>Product Details</h3>
                    <div class="product-detail">
                        <span>Base Price:</span>
                        <span id="base-price">$24.99</span>
                    </div>
                </div>

                <!-- Color Selection -->
                <div class="control-section">
                    <h3>Choose Color</h3>
                    <div class="color-picker">
                        <button class="color-option active" data-color="#ffffff" style="background-color: #ffffff;" title="White"></button>
                        <button class="color-option" data-color="#1a1a1a" style="background-color: #1a1a1a;" title="Black"></button>
                        <button class="color-option" data-color="#3b82f6" style="background-color: #3b82f6;" title="Blue"></button>
                        <button class="color-option" data-color="#22c55e" style="background-color: #22c55e;" title="Green"></button>
                        <button class="color-option" data-color="#f97316" style="background-color: #f97316;" title="Orange"></button>
                    </div>
                    <p class="selected-color">Selected: <span id="color-name">White</span></p>
                </div>

                <!-- Sticker Selection -->
                <div class="control-section">
                    <h3>Add Stickers <span class="sticker-price">(+$2 each)</span></h3>
                    <div class="sticker-grid">
                        <label class="sticker-option">
                            <input type="checkbox" name="sticker" value="Star" data-price="2">
                            <div class="sticker-box">
                                <div class="sticker-icon">⭐</div>
                                <p>Star</p>
                            </div>
                        </label>
                        <label class="sticker-option">
                            <input type="checkbox" name="sticker" value="Heart" data-price="2">
                            <div class="sticker-box">
                                <div class="sticker-icon">❤️</div>
                                <p>Heart</p>
                            </div>
                        </label>
                        <label class="sticker-option">
                            <input type="checkbox" name="sticker" value="Lightning" data-price="2">
                            <div class="sticker-box">
                                <div class="sticker-icon">⚡</div>
                                <p>Lightning</p>
                            </div>
                        </label>
                        <label class="sticker-option">
                            <input type="checkbox" name="sticker" value="Fire" data-price="2">
                            <div class="sticker-box">
                                <div class="sticker-icon">🔥</div>
                                <p>Fire</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Price Summary -->
                <div class="control-section price-summary">
                    <div class="price-row">
                        <span>Base Price:</span>
                        <span id="summary-base">$24.99</span>
                    </div>
                    <div class="price-row">
                        <span>Stickers:</span>
                        <span id="sticker-cost">$0.00</span>
                    </div>
                    <div class="price-row total">
                        <span>Total:</span>
                        <span id="total-price">$24.99</span>
                    </div>
                </div>

                <!-- Add to Cart Button -->
                <button class="add-to-cart-btn" id="add-to-cart">
                    🛒 Add to Cart
                </button>

            </div>
        </div>

    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

    <script src="js/app.js"></script>
    
    <!-- Studio JavaScript -->
    <script>
        // Get product details from session storage
        const productData = JSON.parse(sessionStorage.getItem('selectedProduct')) || {
            name: 'Classic Cap',
            basePrice: 24.99,
            type: 'cap'
        };

        // Update UI with product details
        document.getElementById('product-title').textContent = productData.name;
        document.getElementById('base-price').textContent = `$${productData.basePrice.toFixed(2)}`;
        document.getElementById('summary-base').textContent = `$${productData.basePrice.toFixed(2)}`;
        document.getElementById('total-price').textContent = `$${productData.basePrice.toFixed(2)}`;

        // Three.js Scene Setup
        let scene, camera, renderer, model, controls;
        let selectedColor = '#ffffff';
        let colorName = 'White';
        let stickers = [];

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            // Create Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf0f0f0);

            // Create Camera
            camera = new THREE.PerspectiveCamera(
                50,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(0, 1, 3);

            // Create Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Add Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            const pointLight = new THREE.PointLight(0xffffff, 0.5);
            pointLight.position.set(-5, 5, -5);
            scene.add(pointLight);

            // Add OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 2;

            // Load 3D Model
            loadModel();

            // Handle Window Resize
            window.addEventListener('resize', onWindowResize);

            // Start Animation Loop
            animate();
        }

        function loadModel() {
            const loader = new THREE.GLTFLoader();
            
            // Try to load the .glb model, fallback to a basic shape if not found
            loader.load(
                'models/cap.glb',
                function(gltf) {
                    model = gltf.scene;
                    model.scale.set(1, 1, 1);
                    scene.add(model);
                    updateModelColor(selectedColor);
                },
                undefined,
                function(error) {
                    console.log('GLB not found, creating fallback geometry');
                    createFallbackModel();
                }
            );
        }

        function createFallbackModel() {
            // Create a simple cap-like shape as fallback
            const group = new THREE.Group();
            
            // Cap bill
            const billGeometry = new THREE.BoxGeometry(1.5, 0.1, 1);
            const billMaterial = new THREE.MeshStandardMaterial({ color: selectedColor });
            const bill = new THREE.Mesh(billGeometry, billMaterial);
            bill.position.set(0, 0, 0.5);
            group.add(bill);
            
            // Cap crown
            const crownGeometry = new THREE.SphereGeometry(0.7, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const crownMaterial = new THREE.MeshStandardMaterial({ color: selectedColor });
            const crown = new THREE.Mesh(crownGeometry, crownMaterial);
            crown.position.set(0, 0.5, 0);
            group.add(crown);
            
            model = group;
            scene.add(model);
        }

        function updateModelColor(color) {
            if (!model) return;
            
            model.traverse((child) => {
                if (child.isMesh) {
                    child.material.color.setStyle(color);
                }
            });
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Color Selection Logic
        const colorOptions = document.querySelectorAll('.color-option');
        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                // Remove active class from all
                colorOptions.forEach(opt => opt.classList.remove('active'));
                // Add active class to clicked
                this.classList.add('active');
                
                // Update color
                selectedColor = this.getAttribute('data-color');
                colorName = this.getAttribute('title');
                document.getElementById('color-name').textContent = colorName;
                
                // Update 3D model color
                updateModelColor(selectedColor);
            });
        });

        // Sticker Selection Logic
        const stickerCheckboxes = document.querySelectorAll('input[name="sticker"]');
        stickerCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', updatePrice);
        });

        function updatePrice() {
            stickers = [];
            let stickerCost = 0;
            
            stickerCheckboxes.forEach(checkbox => {
                if (checkbox.checked) {
                    stickers.push(checkbox.value);
                    stickerCost += parseFloat(checkbox.getAttribute('data-price'));
                }
            });
            
            const totalPrice = productData.basePrice + stickerCost;
            
            document.getElementById('sticker-cost').textContent = `$${stickerCost.toFixed(2)}`;
            document.getElementById('total-price').textContent = `$${totalPrice.toFixed(2)}`;
        }

        // Add to Cart Functionality
        document.getElementById('add-to-cart').addEventListener('click', function() {
            const cartItem = {
                id: Date.now(),
                name: productData.name,
                basePrice: productData.basePrice,
                color: colorName,
                colorHex: selectedColor,
                stickers: stickers,
                stickerCost: stickers.length * 2,
                totalPrice: productData.basePrice + (stickers.length * 2)
            };
            
            // Get existing cart from localStorage
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.push(cartItem);
            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Update cart count
            updateCartCount();
            
            // Show confirmation
            alert(`${productData.name} added to cart!\nColor: ${colorName}\nStickers: ${stickers.join(', ') || 'None'}\nTotal: $${cartItem.totalPrice.toFixed(2)}`);
            
            // Optionally redirect to cart
            window.location.href = 'cart.html';
        });

        // Initialize Three.js when page loads
        window.addEventListener('load', initThreeJS);
    </script>
</body>
</html>
